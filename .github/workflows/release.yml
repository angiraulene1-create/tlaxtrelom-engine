#
# Release automatizado: al publicar una etiqueta `v*` (o lanzándolo a mano con
# workflow_dispatch) construye los instaladores de cada plataforma con el mismo
# `cargo xtask package` que se corre en local, y los adjunta al Release de
# GitHub. Degrada sin fingir: HarmonyOS sólo se intenta si hay NDK configurado,
# y un fallo suyo no bloquea el release de Linux/Windows.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar (por defecto, la del push)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # El push de etiquetas entrega refs/tags/vN; dispatch entrega la rama por la
  # que se lanza, así que la etiqueta a publicar viene del input si existe.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    name: instaladores Linux
    # Ubuntu 22.04 = glibc 2.35: los binarios salen compatibles con casi
    # cualquier distro viva. En ubuntu-latest (glibc 2.43) el AppImage no
    # arrancaba en máquinas con glibc más vieja.
    # Aquí no se instalan glslc/spirv-tools: `xtask package` no compila
    # shaders (eso lo hace el paso `shaders` de ci.yml, que corre en
    # ubuntu-latest, donde el paquete glslc sí existe; en 22.04 no).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libzstd-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libvulkan-dev \
            flatpak \
            ostree

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Empaquetar (deb, AppImage, Flatpak, portable)
        run: cargo xtask package --platform linux

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.flatpak
          if-no-files-found: error

  windows:
    name: instaladores Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Sin esto el host sería MSVC y xtask empaqueta la tripleta del host;
          # MSVC vale, pero fijamos el objetivo explícito del portable.
          target: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # xtask comprime el portable con `python3`; en Windows el runner sólo
      # expone `python`, así que se crea el alias `python3` junto a él.
      - name: Asegurar python3 en Windows
        run: |
          PY="$(command -v python)"
          [ -x "$(command -v python3)" ] || cp "$PY" "$(dirname "$PY")/python3.exe"
          python3 --version

      # makensis genera tlaxtrelom-setup.exe; sin él, xtask degrada al
      # instalador de respaldo y el paquete sigue saliendo adelante.
      # Ojo: choco modifica el PATH de la MÁQUINA, que los pasos siguientes no
      # heredan; hay que publicar la carpeta de NSIS vía GITHUB_PATH.
      - name: Instalar NSIS (makensis)
        run: |
          choco install nsis -y || echo "aviso: sin NSIS, se usará el instalador de respaldo"
          NSIS_DIR=""
          for d in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS"; do
            if [ -x "$d/makensis.exe" ]; then NSIS_DIR="$d"; break; fi
          done
          if [ -n "$NSIS_DIR" ]; then
            echo "C:${NSIS_DIR#/c}" >> "$GITHUB_PATH"
            echo "makensis disponible en C:${NSIS_DIR#/c}"
          else
            echo "aviso: makensis no está en el sistema, se usará el instalador de respaldo"
          fi

      - name: Empaquetar (zip, exe, setup)
        run: cargo xtask package --platform windows

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  # HarmonyOS exige el NDK de OpenHarmony y la tripleta aarch64-unknown-linux-ohos.
  # Los runners públicos no traen ni una cosa ni la otra, y docs/09 ya reconoce
  # que no hay SDK OHOS en CI pública. Por eso este trabajo es OPT-IN: sólo corre
  # si defines la variable de repositorio OHOS_NDK_URL (apuntando a un zip/tar del
  # NDK accesible) y sigue siendo best-effort: su fallo no bloquea el release.
  harmonyos:
    name: instalador HarmonyOS (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    if: vars.OHOS_NDK_URL != ''
    env:
      OHOS_NDK_HOME: ${{ github.workspace }}/ohos-ndk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libzstd-dev zip unzip

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - uses: Swatinem/rust-cache@v2

      - name: Descargar NDK de OpenHarmony
        run: |
          mkdir -p "$OHOS_NDK_HOME"
          curl -fL "$OHOS_NDK_URL" -o /tmp/ohos-ndk.zip
          # Se asume un archivo que al descomprimir deja llvm/bin/clang++ dentro
          # de $OHOS_NDK_HOME (la ruta que busca xtask package).
          unzip -q /tmp/ohos-ndk.zip -d "$OHOS_NDK_HOME"
          test -x "$OHOS_NDK_HOME/llvm/bin/clang++" || {
            echo "el NDK descargado no tiene llvm/bin/clang++; revisa OHOS_NDK_URL"; exit 1; }

      - name: Empaquetar (zip con árbol HAP)
        run: cargo xtask package --platform harmonyos --cross

      - uses: actions/upload-artifact@v4
        with:
          name: dist-harmonyos
          path: dist/*.zip
          if-no-files-found: warn

  publicar:
    name: publicar Release
    needs: [linux, windows, harmonyos]
    if: always() && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reunir artefactos
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Notas desde el CHANGELOG
        run: |
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f' CHANGELOG.md > /tmp/notas.md
          # Si el CHANGELOG no tiene la sección, nota mínima honesta.
          [ -s /tmp/notas.md ] || printf 'Instaladores de %s.\n' "$RELEASE_TAG" > /tmp/notas.md
          # El título va aparte; se quita el encabezado duplicado de las notas.
          sed -i '1{/^$/d}' /tmp/notas.md

      - name: Aviso pre-release
        run: |
          # gh NO marca sola la pre-release por el sufijo semver (comprobado
          # en v0.4.0-alpha.1: salió como release estable); aquí se fija el
          # flag explícito y se añade la advertencia visible a las notas.
          case "$RELEASE_TAG" in
            *-*)
              {
                printf '> [!WARNING]\n'
                printf '> **Versión alfa: proyecto experimental/conceptual.**\n'
                printf '> Etapa temprana: estos binarios pueden fallar, cambiar de formato sin aviso o no funcionar en tu equipo. No aptos para producción.\n\n'
                cat /tmp/notas.md
              } > /tmp/notas-alpha.md
              mv /tmp/notas-alpha.md /tmp/notas.md
              ;;
          esac

      - name: Crear o actualizar el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          extra=()
          case "$RELEASE_TAG" in
            *-*) extra+=(--prerelease) ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" "${extra[@]}"
            echo "Release existente actualizado con ${#assets[@]} artefactos."
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Tlaxtrelom Engine $RELEASE_TAG" \
              --notes-file /tmp/notas.md \
              "${extra[@]}" \
              --verify-tag
            echo "Release creado con ${#assets[@]} artefactos."
          fi

      # Las sumas se recalculan sobre TODOS los assets finales del release,
      # no sólo los de esta corrida: así quedan cubiertos también restos de
      # subidas manuales (p. ej. un .deb construido en local).
      - name: SHA256SUMS del release completo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/activos && mkdir -p /tmp/activos
          # El gh de los runners no conoce --exclude en release download, así
          # que se descarga todo y se quita la suma vieja a mano.
          gh release download "$RELEASE_TAG" --dir /tmp/activos --clobber
          rm -f /tmp/activos/SHA256SUMS
          (cd /tmp/activos && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$RELEASE_TAG" /tmp/activos/SHA256SUMS --clobber
