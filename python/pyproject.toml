[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tlaxtrelom-tools"
version = "0.3.1"
description = "Herramientas de autoría y pipeline de Tlaxtrelom Engine"
readme = { text = "Herramientas de autoría y pipeline de Tlaxtrelom Engine, bajo licencia MIT.", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "angiraulene1-create" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
dev = ["mypy>=1.10", "ruff>=0.5"]

[project.scripts]
tlaxtrelom-tools = "tlaxtrelom_tools.cli:main"

[tool.setuptools]
packages = ["tlaxtrelom_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
